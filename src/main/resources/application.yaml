# Spring Application Configuration
spring:
  application:
    name: military-transport-api
  
  # Database Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/military_db
    username: military_user
    password: military_pass
    driver-class-name: org.postgresql.Driver
  
  # SQL Initialization (вимкнено - використовуємо Liquibase)
  sql:
    init:
      mode: never
  
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: none  # ВАЖЛИВО: Liquibase керує схемою БД!
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  
  # Liquibase Configuration
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
    drop-first: false  # НЕ видаляти БД при старті!
  
  # Redis Configuration
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 60000ms
  
  # Cache Configuration
  cache:
    type: redis
    redis:
      time-to-live: 3600000  # TTL = 1 година (мс)

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# Logging Configuration
logging:
  level:
    ua.edu.viti.military: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Server Configuration
server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

# Actuator Configuration (для метрик)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

# JWT Configuration
app:
  jwt:
    secret: VerySecretKeyThatShouldBeAtLeast256BitsLongForHS256AlgorithmSecurityMilitary2024
    expiration-ms: 86400000  # 24 години